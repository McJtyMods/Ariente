buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def localGradleTools = [
        project.findProperty('gradletools_path') ? file(project.property('gradletools_path')) : null,
        rootProject.file('gradletools.gradle'),
        file('../Multi_fabric/gradletools.gradle'),
        file('gradletools.gradle')
].find { it != null && it.isFile() }
apply from: localGradleTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_fabric/gradletools.gradle'

group = "com.github.mcjty"
base.archivesName = "ariente-fabric"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
access()
runs()
jars()
tasks.withType(Jar).configureEach { exclude '.cache/**' }

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    config()
    energy()
    jei()
    top()
    mcjtylib()
    if (findProject(':ModHoloGui') != null) {
        implementation project(':ModHoloGui')
    } else {
        implementation("com.github.mcjty:hologui-fabric:${hologui_version}") { transitive = false }
    }
}

modpublisher(['the-one-probe', 'ariente-world', 'patchouli'], ['mcjtylib', 'hologui'], ['the-one-probe', 'ariente-world', 'patchouli'], ['mcjtylib', 'hologui'], [])

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) { include 'mcjty/ariente/api/**' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.apiJar
            artifactId = base.archivesName.get()
        }
    }
    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url = uri(project.property('mavendir')) }
        } else if (System.getenv('local_maven') != null) {
            maven { url = uri(System.getenv('local_maven')) }
        } else {
            mavenLocal()
        }
    }
}

processResources {
    exclude '.cache/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Loom loads the same local sources in standalone development and workspace runs.
def localMods = ['McJtyLib', 'TheOneProbe', 'ModHoloGui'].findAll {
    it != project.name && findProject(":" + it) != null
}
localMods.each { modName ->
    evaluationDependsOn(":" + modName)
    loom.mods.register(modName.toLowerCase()) { sourceSet project(":" + modName).sourceSets.main }
}

// Development launches load the included class directories and avoid duplicate dependency jars.
tasks.withType(JavaExec).configureEach {
    def sources = localMods.collect { project(":" + it) }
    def localJars = sources.collect { it.tasks.named('jar', Jar).get().archiveFile.get().asFile } as Set
    dependsOn tasks.named('classes'), sources.collect { it.tasks.named('classes') }
    def launchClasspath = files(classpath.files)
    classpath = launchClasspath.filter { !localJars.contains(it) } + files(sources.collect { it.sourceSets.main.output })
}
