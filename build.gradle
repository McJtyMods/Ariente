buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def localGradleTools = [
        project.findProperty('gradletools_path') ? file(project.property('gradletools_path')) : null,
        rootProject.file('gradletools.gradle'),
        file('../Multi_neo/gradletools.gradle'),
        file('gradletools.gradle')
].find { it != null && it.isFile() }
apply from: localGradleTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.1.2_neo/gradletools.gradle'



group = "com.github.mcjty"
base.archivesName = "ariente"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neo_version = '26.1.2.99'

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
at()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    patchouli()
    top()
    mcjtylib()
    if (findProject(':ModHoloGui') != null) {
        implementation project(':ModHoloGui')
    } else {
        implementation("com.github.mcjty:hologui:${hologui_version}") { transitive = false }
    }
}

// Unpublished dependency artifacts can be staged for standalone verification.
if (project.hasProperty('ariente_dependency_repository')) {
    repositories.maven { url = uri(project.property('ariente_dependency_repository')) }
}

modpublisher(['the-one-probe', 'ariente-world', 'patchouli'], ['mcjtylib', 'hologui'], ['the-one-probe', 'ariente-world', 'patchouli'], ['mcjtylib', 'hologui'], [])

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) { include 'mcjty/ariente/api/**' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.apiJar
            artifactId = base.archivesName.get()
        }
    }
    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url = uri(project.property('mavendir')) }
        } else if (System.getenv('local_maven') != null) {
            maven { url = uri(System.getenv('local_maven')) }
        } else {
            mavenLocal()
        }
    }
}


// NeoGradle consumes local mod source sets in development, including transitive mod dependencies.
def localMods = ['McJtyLib', 'TheOneProbe', 'ModHoloGui']
localMods.findAll { findProject(":" + it) != null }.each { modName ->
    evaluationDependsOn(":" + modName)
    runs { configureEach { modSource project(":" + modName).sourceSets.main } }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java.include 'mcjty/ariente/StorageTests.java'
        resources.include 'data/ariente/structure/empty.nbt'
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
runs {
    configureEach {
        workingDirectory project.file("build/verification/${name}")
    }
    gameTestServer {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        modSource sourceSets.gameTest
    }
}

// FML must load the included checkouts, including fixtures, instead of choosing duplicate dependency jars.
tasks.withType(JavaExec).configureEach {
    doFirst {
        def sourceJars = localMods.collect { findProject(":" + it) }.findAll { it != null }
                .collect { it.tasks.named('jar', Jar).get().archiveFile.get().asFile } as Set
        classpath = classpath.filter { !sourceJars.contains(it) }
    }
}
