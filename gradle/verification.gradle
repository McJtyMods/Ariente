// Opt-in, isolated runs for port verification. Normal development runs are unchanged.
def localMods = [':ModHoloGui': 'hologui', ':McJtyLib': 'mcjtylib', ':TheOneProbe': 'theoneprobe']
localMods.keySet().findAll { findProject(it) != null }.each { evaluationDependsOn(it) }

minecraft.runs.all {
    forceExit false
    jvmArgs '-Xmx2G'
    mods {
        ariente {
            source sourceSets.main
        }
        localMods.each { path, modId ->
            if (findProject(path) != null) {
                create(modId) {
                    source project(path).sourceSets.main
                }
            }
        }
    }
}
minecraft.runs.data {
    // RunConfig.setArgs appends; clear the shared helper's output arguments first.
    getArgs().clear()
    args '--mod', 'ariente', '--all', '--output', file('build/verification/datagen').absolutePath,
            '--existing', file('src/main/resources').absolutePath
    workingDirectory file('build/verification/datagen-run')
}
minecraft.runs.client {
    workingDirectory file('build/verification/client')
}
minecraft.runs.server {
    workingDirectory file('build/verification/server')
    args '--nogui'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
minecraft.runs {
    gameTestServer {
        workingDirectory project.file('build/verification/forcefield-server')
        property 'forge.enabledGameTestNamespaces', 'ariente'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        mods.ariente.source(sourceSets.gameTest)
    }
}

if (project.hasProperty('ariente_forcefield_check')) {
    minecraft.runs.client {
        workingDirectory project.file('build/verification/forcefield-client')
        mods.ariente.source(sourceSets.gameTest)
        property 'ariente.forcefieldClientCheck', 'true'
        if (project.hasProperty('ariente_forcefield_arrows')) {
            property 'ariente.forcefieldArrowCheck', 'true'
        }
        args '--quickPlaySingleplayer', 'ForcefieldCheck', '--width', '1280', '--height', '720'
    }
    tasks.withType(JavaExec).configureEach {
        if (name == 'runClient') {
            dependsOn 'gameTestClasses'
        }
    }
}

if (project.hasProperty('ariente_flux_check')) {
    minecraft.runs.client {
        workingDirectory project.file('build/verification/flux-client')
        mods.ariente.source(sourceSets.gameTest)
        property 'ariente.fluxClientCheck', 'true'
        args '--quickPlaySingleplayer', 'FluxCheck', '--width', '1000', '--height', '700'
    }
    tasks.withType(JavaExec).configureEach {
        if (name == 'runClient') {
            dependsOn 'gameTestClasses'
        }
    }
}

// Reuse the existing JEI/progression driver while deliberately leaving the companion unloaded.
if (project.hasProperty('ariente_progression_check')) {
    sourceSets {
        verification {
            java {
                srcDir '../ArienteWorld/src/gameTest/java'
                include 'mcjty/arienteworld/client/ProgressionClientChecks.java'
            }
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations {
        verificationImplementation.extendsFrom implementation
        verificationCompileOnly.extendsFrom compileOnly
        verificationRuntimeOnly.extendsFrom runtimeOnly
    }
    minecraft.runs.client {
        mods.ariente.source(sourceSets.verification)
        property 'ariente.progressionClientCheck', 'true'
        property 'ariente.expectCompanion', 'false'
        args '--quickPlaySingleplayer', 'ProgressionCheck'
    }
    tasks.withType(JavaExec).configureEach {
        if (name == 'runClient') {
            dependsOn 'verificationClasses'
        }
    }
}

// Forge otherwise discovers built dependency jars as well as the requested sources.
tasks.withType(JavaExec).configureEach {
    if (name.startsWith('run')) {
        doFirst {
            def localJarDirs = rootProject.allprojects.collect { it.file('build/libs').toPath() }
            def keep = { File entry -> !localJarDirs.any { entry.toPath().startsWith(it) } }
            classpath = classpath.filter(keep)
            if (systemProperties['legacyClassPath']) {
                systemProperty 'legacyClassPath', systemProperties['legacyClassPath'].toString()
                        .split(File.pathSeparator).findAll { keep(new File(it)) }.join(File.pathSeparator)
            }
        }
    }
}

